[package]
name = "mek-lab"
version = "0.1.0"
edition = "2024"
default-run = "mek-lab"
rust-version = "1.85"
license = "MIT"

[workspace]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
tempfile = "=3.26.0"
flate2 = "=1.1.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
