name: Rust contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rust-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    name: Windows x64 / Rust 1.95.0
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.95.0-x86_64-pc-windows-msvc
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install tested Rust toolchain
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component rustfmt,clippy --no-self-update

      - name: Check formatting
        run: cargo fmt --check

      - name: Check Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run contract tests
        run: cargo test --locked
      - name: Test issue batch preview
        run: ./tools/test-issue-preview.ps1
      - name: Test roadmap issue reconciliation
        run: ./tools/test-roadmap-sync.ps1
      - name: Check the public tree
        run: ./tools/check-public-tree.ps1

      - name: List locked dependency graph
        run: cargo tree --locked --all-features --edges normal,build,dev

      - name: Test GitHub metadata planning
        run: ./tools/test-github-labels.ps1

      - name: Test milestone synchronization
        run: ./tools/test-roadmap-milestones.ps1
