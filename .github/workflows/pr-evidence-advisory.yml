name: Foundry PR evidence advisory

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, edited, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: foundry-pr-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evidence:
    name: PR evidence advisory
    if: ${{ !github.event.pull_request.draft && (github.event.action != 'edited' || github.event.changes.body != null) }}
    permissions:
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check declared verification and evidence
        shell: bash
        run: |
          python3 -I -B - <<'PY'
          import json
          import os
          import re

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event:
              pull_request = json.load(event).get("pull_request", {})

          # Treat contributor text as data. Only fixed messages reach the log.
          body = re.sub(r"<!--.*?-->", "", pull_request.get("body") or "", flags=re.S)
          body = re.sub(r"(?ms)^ {0,3}(`{3,}|~{3,})[^\n]*\n.*?^ {0,3}\1[ \t]*$", "", body)
          sections = {}
          current = None
          for line in body.splitlines():
              heading = re.match(r"^ {0,3}#{1,2}\s+(.+?)\s*#*\s*$", line)
              if heading:
                  current = heading[1].casefold()
                  sections.setdefault(current, [])
              elif current and line.strip() and not re.match(r"^\s*[-*]\s+\[[ xX]\]", line):
                  sections[current].append(line.strip())

          prompts = {
              "task": {"closes #", "task id and declared scope"},
              "change": {"describe the smallest change and any remaining binding gaps."},
              "verification": {"evidence:"},
              "qualification": {"evidence:", "state the exact profile and behavior demonstrated. explain any open gates."},
          }
          findings = []
          for name, placeholders in prompts.items():
              lines = sections.get(name, [])
              if not any(line.casefold() not in placeholders for line in lines):
                  findings.append(f"Fill in the {name.title()} section with a concrete response.")

          evidence_lines = sections.get("verification", []) + sections.get("qualification", [])
          declaration = re.compile(r"^(?:[-*]\s+)?(?:sanitized )?evidence:\s*(.+)$", re.I)
          locator = re.compile(
              r"^(?:\[[^\]\n]+\]\((?:https://[^\s)]+|(?:\./)?evidence/[^\s)]+)\)"
              r"|https://\S+|(?:\./)?evidence/\S+)(?:\s|$)"
          )
          explanation = re.compile(r"^(?:not applicable|pending)\s*(?:[-\u2013\u2014:]\s*|because\s+)\w", re.I)
          evidence_found = any(
              match and (locator.match(match[1]) or explanation.match(match[1]))
              for match in map(declaration.match, evidence_lines)
          )
          if not evidence_found:
              findings.append(
                  "Add an Evidence: line under Verification or Qualification. Link a sanitized "
                  "summary, or state Pending or Not applicable and explain why."
              )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## PR evidence advisory\n\n")
              if findings:
                  for finding in findings:
                      print(f"::warning::{finding}")
                      summary.write(f"- {finding}\n")
              else:
                  summary.write("The PR supplied the expected sections and an evidence declaration.\n")
              summary.write(
                  "\nA maintainer still checks whether the evidence supports the change "
                  "and whether any pending qualification blocks merge.\n"
              )
          PY

      - name: Suggest labels and flag shared issue closures
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I -B - <<'PY'
          import json
          import os
          import re
          import subprocess

          repository = os.environ["GITHUB_REPOSITORY"]
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event:
              current = json.load(event)["pull_request"]

          def read_pages(path):
              response = subprocess.run(
                  ["gh", "api", "--paginate", "--slurp", path],
                  text=True, capture_output=True, check=True, timeout=35,
              )
              return [item for page in json.loads(response.stdout) for item in page]

          def closing_issues(body):
              body = re.sub(r"<!--.*?-->", "", body or "", flags=re.S)
              body = re.sub(r"(?ms)^ {0,3}(\x60{3,}|~{3,})[^\n]*\n.*?^ {0,3}\1[ \t]*$", "", body)
              slug = re.escape(repository)
              target = rf"(?:#|{slug}#|https://github\.com/{slug}/issues/)"
              pattern = rf"(?im)^[ \t]*(?:[-*][ \t]+)?(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)[ \t]+{target}([1-9][0-9]*)(?=$|[\s.,;)])"
              return {int(match) for match in re.findall(pattern, body)}

          def suggestions(paths):
              labels = set()
              if paths and all(path.endswith(".md") for path in paths):
                  labels.add("type:docs")
              elif any(path.startswith((".github/", "tools/")) for path in paths):
                  labels.add("type:tooling")
              if any(path.startswith("adapters/neoforge/") for path in paths):
                  labels.add("area:runtime")
              if any(path.startswith(("src/", "tests/")) for path in paths):
                  labels.add("area:parity-engine")
              return sorted(labels)

          number = current["number"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n## PR triage suggestions\n\n")
              try:
                  files = read_pages(f"repos/{repository}/pulls/{number}/files?per_page=100")
                  paths = [item["filename"] for item in files]
                  paths.extend(item["previous_filename"] for item in files if "previous_filename" in item)
                  labels = suggestions(paths)
                  summary.write(f"- Suggested labels: {', '.join(labels) or 'none from paths'}.\n")
              except (OSError, subprocess.SubprocessError, ValueError, KeyError, TypeError):
                  print("::warning::Could not read PR files for label suggestions.")
                  summary.write("- Label suggestions unavailable.\n")

              try:
                  issues = closing_issues(current.get("body"))
                  if not issues:
                      summary.write("- No local issue closing declaration to compare.\n")
                  else:
                      matches = []
                      for other in read_pages(f"repos/{repository}/pulls?state=open&per_page=100"):
                          if other["number"] != number:
                              for issue in sorted(issues & closing_issues(other.get("body"))):
                                  matches.append((issue, other["number"]))
                      if matches:
                          print("::warning::Another open PR declares closure of the same issue.")
                          for issue, other in sorted(matches)[:10]:
                              summary.write(f"- Issue #{issue} is also declared for closure by PR #{other}.\n")
                          if len(matches) > 10:
                              summary.write(f"- {len(matches) - 10} more matches omitted.\n")
                      else:
                          summary.write("- No other open PR declares closure of the same issue.\n")
              except (OSError, subprocess.SubprocessError, ValueError, KeyError, TypeError):
                  print("::warning::Could not compare issue closures across open PRs.")
                  summary.write("- Issue closure comparison unavailable.\n")
          PY
